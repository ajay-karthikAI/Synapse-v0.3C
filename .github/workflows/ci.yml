# .github/workflows/ci.yml
# ===========================================================================
# Pull-request and push gate. Everything here is OFFLINE and SECRETLESS.
#
# Two properties this workflow is built around:
#
#   * NO SECRETS. `permissions` is read-only and no `secrets` are referenced.
#     A PR from a fork therefore cannot exfiltrate anything, and a compromised
#     dependency cannot reach a token that does not exist in the environment.
#   * NO EXTERNAL API CALLS. Tests deselect anything marked `live`, the
#     evaluation runs from committed fixtures, and a guard step fails the job
#     if an API key is present in the environment at all.
#
# Action versions are pinned by COMMIT SHA, not tag. A tag is mutable — an
# attacker who compromises an action repository can repoint v4 at malicious
# code, and every workflow pinned to the tag picks it up silently.
# ===========================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Individual jobs widen this only where they must.
permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when new commits land, so a stale red does not
  # sit on a branch that has already been fixed.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"          # Matches requires-python and the devcontainer
  FORCE_COLOR: "1"

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # Cache key is derived from the dependency declaration, so a changed
          # pin produces a new cache rather than restoring a stale environment.
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: ruff check
        run: ruff check .

  # -------------------------------------------------------------------------
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: ruff format --check
        # Scoped to code. Markdown docs contain python fences that ruff would
        # also reformat, which is not what this gate is for.
        run: ruff format --check synapse tests

  # -------------------------------------------------------------------------
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: mypy
        # Scoped to the layers that are fully annotated. Widening the scope is a
        # deliberate act, not something that happens by a file being added.
        run: mypy synapse/schemas synapse/evals synapse/answer synapse/corpus synapse/index synapse/ui synapse/service synapse/runtime synapse/api synapse/retrieval synapse/bench synapse/telemetry synapse/evidence synapse/brief synapse/a11y

  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: Assert no API credentials are present
        # Requirement 6, enforced rather than assumed. If a key is ever exposed
        # to this workflow the job fails instead of quietly spending money.
        run: |
          for var in OPENAI_API_KEY NCBI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!var:-}" ]; then
              echo "::error::$var is set in a workflow that must make no external calls"
              exit 1
            fi
          done
          echo "No API credentials present."
      - name: pytest
        # `-m "not live"` is the project default in pyproject.toml; repeated
        # here so the intent is visible at the call site.
        run: pytest -m "not live" --cov=synapse --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: Migration, ingestion, governance and harness integration
        # These exercise whole pipelines against committed fixtures: the
        # restricted pickle reader, the PubMed XML parser, source-pack
        # workflows, the evaluation harness end to end, and the production
        # answer path (retrieval and generation injected, so it stays offline).
        run: |
          pytest -m "not live" \
            tests/test_migration.py \
            tests/test_ingest_client_and_pipeline.py \
            tests/test_governance_workflows.py \
            tests/test_evals_harness.py \
            tests/test_evalset_workflows.py \
            tests/test_answer_snapshots.py \
            tests/test_ui_pipeline.py \
            tests/test_service.py \
            tests/test_service_golden.py \
            tests/test_runtime_artifacts.py \
            tests/test_runtime_backends.py \
            tests/test_api.py \
            tests/test_api_openapi.py \
            tests/test_retrieval_pipeline.py \
            tests/test_retrieval_benchmark.py \
            tests/test_telemetry_privacy.py \
            tests/test_telemetry_metrics.py \
            tests/test_evidence_ux.py \
            tests/test_evidence_snapshots.py \
            tests/test_appointment_brief.py \
            tests/test_brief_print_snapshots.py \
            tests/test_accessibility.py

  # -------------------------------------------------------------------------
  api-contract:
    name: API contract and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      # Split out of `integration-tests` so the two questions a reviewer asks
      # most often -- "did the wire contract change?" and "can anything log a
      # query?" -- have their own red/green rather than being one line in a
      # twenty-file run.
      - name: FastAPI contract, envelopes and OpenAPI snapshot
        run: |
          pytest -m "not live" \
            tests/test_api.py \
            tests/test_api_openapi.py \
            tests/test_frontend_fixtures.py \
            tests/test_service_retrieval.py
      - name: Privacy and telemetry
        # The invariant these hold: no query, answer, excerpt, note, credential
        # or token reaches a log line, a metric label or a progress message.
        run: |
          pytest -m "not live" \
            tests/test_telemetry_privacy.py \
            tests/test_telemetry_metrics.py \
            tests/test_no_pickle_and_imports.py
      - name: Interface separation and container contract
        # Streamlit stays a fallback over the same service; the image ships
        # neither it nor a secret.
        run: |
          pytest -m "not live" \
            tests/test_streamlit_fallback.py \
            tests/test_container_contract.py
      - name: Deployment configuration
        # The names an operator types must be the names the code reads. Each
        # mismatch fails misleadingly in production -- a missing session secret
        # reports "session expired" rather than "unconfigured" -- so the aliases,
        # render.yaml and vercel.json are asserted here.
        run: pytest -m "not live" tests/test_deployment_config.py

  # -------------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api,runtime,streamlit]"
      - name: pip-audit
        # Every extra is installed above, so the audit covers what a deployment
        # and a local fallback actually resolve -- auditing only `[dev,api]`
        # would leave the container's retrieval stack unscanned.
        run: pip-audit --strict --progress-spinner=off
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        # Production dependencies are what ships to a patient's browser. Dev
        # tooling advisories are reported but do not fail the build.
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical || echo "::warning::dev-dependency advisories above"

  # -------------------------------------------------------------------------
  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image
        # No secrets, no registry push. The image is built and exercised inside
        # the job and then discarded.
        run: docker build -t synapse-api:ci .
      - name: Health and readiness smoke test, with a fake provider
        # Asserts the degrade `serve_api.py` documents: a missing model
        # credential leaves the process UP and unready with a typed code, rather
        # than crash-looping. Also asserts the image ships no Streamlit, no
        # .env, no pickle, and runs as a non-root user.
        run: ./scripts/smoke_container.sh synapse-api:ci
      - name: Assert no credential was baked into a layer
        run: |
          if docker run --rm --entrypoint sh synapse-api:ci -c 'ls -A /app' | grep -qE '^\.env'; then
            echo "::error::a .env file is present in the image"
            exit 1
          fi
          echo "No .env in the image."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate the deployment configuration
        # Builds the image and starts it with the DEPLOYMENT variable names
        # (DEMO_ACCESS_PASSWORD / DEMO_SESSION_SECRET), proving the aliases
        # resolve in a real container. Deploys nothing and contacts no platform.
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          ./scripts/validate_deployment.sh

  # -------------------------------------------------------------------------
  artifact-validation:
    name: Artifact and schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: Validate the example source pack
        # Digest mismatch, expired approval, unreviewed-approval claims: all
        # blocking. Exit code is non-zero on any error-severity finding.
        run: python -m synapse.cli.source_pack validate --pack source_packs/diabetes-previsit
      - name: Validate the CI evaluation dataset
        run: python -m synapse.cli.evalset validate --dataset evals/ci
      - name: Assert no case in the CI dataset can gate a release
        # The CI dataset is synthetic and unreviewed. This asserts the gating
        # layer still refuses it, so the "0 gating-eligible" caveat in every
        # report stays true rather than drifting.
        run: |
          python -m synapse.cli.evalset gating --dataset evals/ci --json > gating.json
          python - <<'PY'
          import json, sys
          data = json.load(open("gating.json"))
          if data["eligible_count"] != 0:
              sys.exit(f"expected 0 gating-eligible cases in the synthetic CI dataset, got {data['eligible_count']}")
          print("Confirmed: 0 gating-eligible cases. Reports must not claim clinical validation.")
          PY
      - name: Schema and manifest round-trip checks
        run: pytest -m "not live" tests/test_manifest_and_integrity.py tests/test_schema_validation.py tests/test_jsonl_roundtrip.py

  # -------------------------------------------------------------------------
  offline-evaluation:
    name: Offline evaluation and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,api]"
      - name: Run the offline evaluation
        # --offline replays committed system responses. No model is called, no
        # network is touched, and the run reproduces byte-for-byte.
        run: |
          python -m synapse.evals.run \
            --dataset evals/ci \
            --fixture evals/ci/system_responses.jsonl \
            --corpus evals/ci \
            --output artifacts/evals/candidate \
            --run-id "ci-${{ github.run_id }}" \
            --offline
      - name: Check quality gates against the approved baseline
        # Writes the Markdown summary into the job summary and the machine
        # readable report alongside the artifacts. Non-zero exit fails the job.
        run: |
          python -m synapse.cli.check_gates \
            --results artifacts/evals/candidate/results.json \
            --baseline evals/baselines/approved/results.json \
            --config configs/quality-gates.toml \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --json-out artifacts/evals/candidate/gate_report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()   # Uploaded even when the gates fail — that is when they are most needed
        with:
          name: evaluation-reports
          path: |
            artifacts/evals/candidate/results.json
            artifacts/evals/candidate/summary.json
            artifacts/evals/candidate/report.md
            artifacts/evals/candidate/per_case.jsonl
            artifacts/evals/candidate/gate_report.json
          retention-days: 30


  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` rather than `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lock have diverged.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # The generated client types must match the committed OpenAPI contract,
      # which the Python suite pins. A backend contract change fails here
      # rather than at runtime.
      - name: Verify generated API types
        run: npm run verify:api
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders. No secret is baked into the bundle: these
          # are read at request time on the server, and the build only needs
          # them to exist.
          SYNAPSE_SERVICE_TOKEN: ci-build-placeholder-0123456789ab
          SYNAPSE_JWT_SECRET: ci-build-placeholder-0123456789ab
      # Both engines. The appointment brief is a modal `dialog` on mobile and a
      # non-modal `complementary` region on desktop -- different ARIA and a
      # different keyboard contract -- so running one project would leave half
      # of that contract untested.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility and visual snapshots
        # Visual baselines are committed as `-chromium-linux`, which is what
        # this runner is; they are generated with scripts/visual_snapshots.sh
        # using the same pinned Playwright container, so CI and a developer
        # compare against identical images.
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # -------------------------------------------------------------------------
  ci-passed:
    # Single required status check for branch protection. Adding a job above
    # does not require a branch-protection change; it just has to be listed here.
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - format
      - typecheck
      - unit-tests
      - integration-tests
      - api-contract
      - dependency-audit
      - container
      - artifact-validation
      - offline-evaluation
      - frontend
    if: always()
    steps:
      - name: Verify every required job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded."
