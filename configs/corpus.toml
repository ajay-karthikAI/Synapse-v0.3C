  "cancer screening recommendations adults NOT (case reports[pt]) NOT (animals[mh] NOT humans[mh]) NOT (in vitro techniques[mh])",
  "iron deficiency anaemia management NOT (case reports[pt]) NOT (animals[mh] NOT humans[mh]) NOT (in vitro techniques[mh])",
  "allergic rhinitis management NOT (case reports[pt]) NOT (animals[mh] NOT humans[mh]) NOT (in vitro techniques[mh])",
]

[chunking]
target_chars = 800
min_chars = 120                          # Sections shorter than this are dropped and the count reported
max_chars = 1600
keep_short_sections = false

[embedding]
# Recorded in the index manifest so a later embedding step can be verified
# against the corpus it was built from. NO embeddings are computed by this
# command; the manifest it writes declares index_state='rebuild_required'.
provider = "openai"
model = "text-embedding-3-small"
dimensions = 1536

[ncbi]
tool = "synapse"
timeout_seconds = 20.0
max_attempts = 4
